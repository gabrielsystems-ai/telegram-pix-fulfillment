name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: public_test
          POSTGRES_PASSWORD: synthetic-local-ci-password
          POSTGRES_DB: test_fulfillment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U public_test -d test_fulfillment"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      LOCAL_TEST_POSTGRES_URL: postgresql+psycopg://public_test:synthetic-local-ci-password@127.0.0.1:5432/test_fulfillment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --disable-socket --allow-hosts=127.0.0.1,::1 -q
      - run: uv run python scripts/public_release_check.py
